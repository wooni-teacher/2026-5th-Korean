<style>
:root{
  --navy:#1F3350;
  --gold:#B5933A;
  --teal:#2D7A6B;
  --bg:#F8F5EF;
  --card:#FFFFFF;
  --border:#D9CFC0;
  --text:#2C2C2C;
  --muted:#7A7060;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
h1,h2,h3,.title-font{font-family:'Gowun Batang',serif;}

/* ── HEADER ── */
.hero{background:var(--navy);color:#fff;padding:40px 24px 48px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%, rgba(181,147,58,.18) 0%, transparent 60%);}
.hero .school{font-size:.82rem;letter-spacing:.12em;color:rgba(255,255,255,.6);margin-bottom:10px;text-transform:uppercase;}
.hero h1{font-size:1.7rem;margin-bottom:8px;position:relative;}
.hero h1 em{color:var(--gold);font-style:normal;}
.hero .subtitle{font-size:.9rem;color:rgba(255,255,255,.65);position:relative;}

/* ── FILTER TABS ── */
.filter-bar{max-width:960px;margin:0 auto;padding:28px 16px 0;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.filter-label{font-size:.78rem;color:var(--muted);margin-bottom:6px;}
.filter-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-family:'Gowun Dodum',sans-serif;font-size:.82rem;transition:all .18s;}
.filter-btn:hover{border-color:var(--teal);color:var(--teal);}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

/* ── GRID ── */
.main{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
.danwon-group{margin-bottom:40px;}
.danwon-title{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.danwon-title h2{font-size:1.1rem;color:var(--navy);}
.danwon-title .line{flex:1;height:1px;background:var(--border);}
.danwon-badge{font-size:.72rem;background:var(--navy);color:#fff;padding:3px 10px;border-radius:10px;font-family:'Gowun Dodum',sans-serif;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}

.app-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .22s;cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;}
.app-card:hover{border-color:var(--teal);box-shadow:0 6px 20px rgba(45,122,107,.18);transform:translateY(-3px);}
.app-card.hidden{display:none;}

.card-top{padding:20px 20px 14px;flex:1;}
.card-icon{font-size:1.8rem;margin-bottom:10px;}
.card-danwon{font-size:.7rem;color:var(--muted);margin-bottom:4px;letter-spacing:.04em;}
.card-title{font-family:'Gowun Batang',serif;font-size:1rem;color:var(--navy);font-weight:700;margin-bottom:6px;line-height:1.4;}
.card-desc{font-size:.8rem;color:var(--muted);line-height:1.65;}

.card-bottom{padding:12px 20px;border-top:1px solid var(--border);background:#FAFAF7;display:flex;align-items:center;justify-content:space-between;}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:.68rem;padding:2px 8px;border-radius:8px;font-family:'Gowun Dodum',sans-serif;}
.tag.firebase{background:#FFF3CD;color:#856404;}
.tag.static{background:#d4edda;color:#155724;}
.tag.writing{background:#cce5ff;color:#004085;}
.tag.drama{background:#f8d7da;color:#721c24;}
.tag.quiz{background:#e2d9f3;color:#4a1e8c;}
.tag.game{background:#fce4d6;color:#8B3A0F;}
.card-arrow{color:var(--teal);font-size:.9rem;font-weight:700;}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:12px;}
.search-input{width:100%;border:1.5px solid var(--border);border-radius:24px;padding:10px 18px 10px 42px;font-family:'Gowun Dodum',sans-serif;font-size:.9rem;background:#fff;color:var(--text);}
.search-input:focus{outline:none;border-color:var(--teal);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--muted);pointer-events:none;}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}
.empty-state p{font-size:.9rem;}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:18px;margin-bottom:24px;flex-wrap:wrap;}
.stat{text-align:center;}
.stat .val{font-size:1.6rem;font-family:'Gowun Batang',serif;color:var(--navy);font-weight:700;display:block;}
.stat .lbl{font-size:.75rem;color:var(--muted);}

/* ── RESPONSIVE ── */
@media(max-width:540px){
  .hero h1{font-size:1.3rem;}
  .card-grid{grid-template-columns:1fr;}
}
</style>

// ── Filter State ──
let filters = { danwon: 'all', type: 'all' };

function setFilter(key, val, el){
  filters[key] = val;
  const group = key==='danwon' ? 'danwonFilters' : 'typeFilters';
  document.querySelectorAll(`#${group} .filter-btn`).forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const { danwon, type } = filters;

  let visible = 0;
  APPS.forEach(app=>{
    const el = document.getElementById(`card-${app.id}`);
    if(!el) return;
    const matchDanwon = danwon==='all' || app.danwon===danwon;
    const matchType = type==='all' || app.tags.includes(type);
    const matchQ = !q ||
      app.title.toLowerCase().includes(q) ||
      app.desc.toLowerCase().includes(q) ||
      (app.keywords||[]).some(k=>k.includes(q));
    const show = matchDanwon && matchType && matchQ;
    el.classList.toggle('hidden', !show);
    if(show) visible++;
  });

  // Toggle danwon groups visibility
  document.querySelectorAll('.danwon-group').forEach(g=>{
    const anyVisible = [...g.querySelectorAll('.app-card')].some(c=>!c.classList.contains('hidden'));
    g.style.display = anyVisible ? '' : 'none';
  });

  document.getElementById('emptyState').style.display = visible===0 ? 'block' : 'none';
}

// ── Render ──
function render(){

  // Group by danwon
  const groups = {};

    if(!groups[app.danwon]) groups[app.danwon] = [];
    groups[app.danwon].push(app);
  });

  const danwonOrder = ['5-1','5-2'];
  const danwonLabels = {'5-1':'5학년 1학기','5-2':'5학년 2학기'};

  danwonOrder.forEach(dw=>{
    if(!groups[dw]) return;
    const section = document.createElement('div');
    section.className = 'danwon-group';
    section.id = `group-${dw}`;
    section.innerHTML = `
      <div class="danwon-title">
        <span class="danwon-badge">${dw}</span>
        <h2>${danwonLabels[dw]}</h2>
        <div class="line"></div>
        <span style="font-size:.78rem;color:var(--muted)">${groups[dw].length}개</span>
      </div>
      <div class="card-grid" id="grid-${dw}"></div>`;
    container.appendChild(section);

    const grid = section.querySelector(`#grid-${dw}`);
    groups[dw].forEach(app=>{
      const tagHtml = app.tags.map(t=>{
        const labels = {firebase:'🔴 실시간',static:'📄 정적',writing:'✍️ 글쓰기',drama:'🎭 역할극',quiz:'❓ 퀴즈'};
        return `<span class="tag ${t}">${labels[t]||t}</span>`;
      }).join('');

      const card = document.createElement('a');
      card.className = 'app-card';
      card.id = `card-${app.id}`;
      card.href = app.url;
      card.target = '_blank';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-icon">${app.icon}</div>
          <div class="card-danwon">${app.danwonLabel} · ${app.chasi}</div>
          <div class="card-title">${app.title}</div>
          <div class="card-desc">${app.desc}</div>
        </div>
        <div class="card-bottom">
          <div class="card-tags">${tagHtml}</div>
          <div class="card-arrow">→</div>
        </div>`;
      grid.appendChild(card);
    });
  });

  // Stats
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><span class="val">${APPS.length}</span><span class="lbl">전체 앱</span></div>
    <div class="stat"><span class="val">${APPS.filter(a=>a.danwon==='5-1').length}</span><span class="lbl">1학기</span></div>
    <div class="stat"><span class="val">${APPS.filter(a=>a.danwon==='5-2').length}</span><span class="lbl">2학기</span></div>
    <div class="stat"><span class="val">${APPS.filter(a=>a.tags.includes('firebase')).length}</span><span class="lbl">실시간 앱</span></div>`;
}

render();
</script>
</body>
</html>
