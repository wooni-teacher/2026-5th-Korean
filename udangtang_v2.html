<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우당탕탕 5학년 1반 편지 — 문장 성분의 호응 관계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1E1A16; --ink-soft:#6B6156; --paper:#FAF7F0; --paper-2:#F2EDE0; --line:#DDD5C0;
    --navy:#1F3350; --navy-mid:#2C4A72; --accent-gold:#B5933A;
    --c-time:#E07B3A; --c-neg:#B65C4A; --c-hon:#3A6B4A; --c-wae:#5A3E72; --c-obj:#2D6B6B;
    --shadow:0 6px 24px rgba(20,15,5,0.13); --shadow-sm:0 2px 8px rgba(20,15,5,0.10);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Gowun Dodum',sans-serif;background:var(--paper-2);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}

  /* HEADER */
  .site-header{background:var(--navy);padding:22px 20px 0;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(10,8,4,0.25);}
  .header-inner{max-width:960px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .header-kicker{font-size:11px;letter-spacing:.14em;color:var(--accent-gold);font-weight:700;margin-bottom:5px;}
  .header-title{font-family:'Gowun Batang',serif;font-size:clamp(17px,3.5vw,24px);color:#fff;line-height:1.2;font-weight:700;}
  .header-sub{font-size:12.5px;color:#C4BAA8;margin-top:3px;}
  .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .answerkey-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);color:#E8DFC8;font-family:'Gowun Dodum',sans-serif;font-size:12px;padding:7px 13px;border-radius:18px;cursor:pointer;white-space:nowrap;}
  .answerkey-btn:hover{background:rgba(255,255,255,0.18);}
  .mode-label{font-size:11px;color:var(--accent-gold);font-weight:700;background:rgba(181,147,58,0.2);padding:4px 10px;border-radius:12px;white-space:nowrap;}

  /* MODE TABS */
  .mode-bar{background:var(--navy-mid);border-top:1px solid rgba(255,255,255,0.08);}
  .mode-bar-inner{max-width:960px;margin:0 auto;display:flex;}
  .mode-tab{flex:1;padding:11px 6px;background:none;border:none;cursor:pointer;font-family:'Gowun Dodum',sans-serif;font-size:12.5px;color:#A0AFCC;font-weight:700;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;line-height:1.35;}
  .mode-tab span{display:block;font-size:13.5px;}
  .mode-tab:hover{color:#ddd;}
  .mode-tab.active{color:#fff;border-bottom-color:var(--accent-gold);}

  /* MAIN */
  .main{max-width:960px;margin:0 auto;padding:26px 16px 80px;}
  .page{display:none;}
  .page.visible{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  /* ─── STUDY PAGE ─── */
  .study-intro{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm);padding:22px 24px;margin-bottom:28px;border-left:5px solid var(--navy);}
  .study-intro h2{font-family:'Gowun Batang',serif;font-size:18px;margin-bottom:8px;}
  .study-intro p{font-size:13.5px;color:var(--ink-soft);line-height:1.75;}

  .type-section{margin-bottom:32px;}
  .type-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid;}
  .type-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff;}
  .type-title{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700;}
  .type-desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.8;background:var(--paper);border-radius:8px;padding:14px 16px;}
  .type-desc strong{color:var(--ink);}

  .type-time .type-header{border-color:var(--c-time);}
  .type-time .type-icon{background:var(--c-time);}
  .type-neg  .type-header{border-color:var(--c-neg);}
  .type-neg  .type-icon{background:var(--c-neg);}
  .type-hon  .type-header{border-color:var(--c-hon);}
  .type-hon  .type-icon{background:var(--c-hon);}
  .type-wae  .type-header{border-color:var(--c-wae);}
  .type-wae  .type-icon{background:var(--c-wae);}

  .ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .ex-card{background:#fff;border-radius:9px;box-shadow:var(--shadow-sm);overflow:hidden;border-top:3px solid var(--c,#999);}
  .ex-card .ex-front{padding:15px 16px;}
  .ex-card .ex-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:9px;background:var(--tag-bg,#eee);color:var(--tag-color,#555);}
  .ex-card .ex-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .ex-card .ex-text-wrong{font-family:'Gowun Batang',serif;font-size:14.5px;color:#8B2E2E;font-weight:700;line-height:1.6;margin-bottom:2px;}
  .ex-card .ex-hint{font-size:12px;color:var(--ink-soft);}
  .ex-card .ex-divider{border:none;border-top:1px dashed var(--line);margin:10px 0;}
  .ex-card .ex-text-correct{font-family:'Gowun Batang',serif;font-size:14px;color:var(--c-hon);font-weight:700;line-height:1.6;}

  /* key words formula box */
  .formula-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1.5px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;}
  .formula-box .kw{font-family:'Gowun Batang',serif;font-weight:700;font-size:14px;}
  .formula-box .arrow{color:var(--ink-soft);}
  .formula-box .must{color:#8B2E2E;font-weight:700;}

  /* ─── ANSWER KEY PAGE ─── */
  .ak-tab-bar{display:flex;background:var(--paper);border-radius:10px;padding:6px;gap:5px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
  .ak-tab-btn{flex:1;padding:9px 4px;background:none;border:none;cursor:pointer;font-family:'Gowun Dodum',sans-serif;font-size:12px;color:var(--ink-soft);font-weight:700;border-radius:7px;transition:background .15s,color .15s;line-height:1.35;}
  .ak-tab-btn span{display:block;font-size:13px;}
  .ak-tab-btn.active{background:var(--navy);color:#fff;}

  .ak-panel{display:none;}
  .ak-panel.visible{display:block;animation:fadeIn .25s ease;}

  .toggle-letter-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-family:'Gowun Dodum',sans-serif;font-size:12.5px;padding:6px 14px;border-radius:16px;cursor:pointer;margin-bottom:14px;}
  .toggle-letter-btn:hover{background:var(--paper-2);}
  .letter-card{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm);padding:20px 22px;margin-bottom:20px;border-left:5px solid var(--accent-gold);}
  .letter-card .lk{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:8px;color:var(--accent-gold);}
  .letter-card .lt{font-family:'Gowun Batang',serif;font-size:13.5px;line-height:2.1;white-space:pre-wrap;word-break:keep-all;}
  .letter-card .lt mark{background:rgba(255,80,80,0.14);color:#8B2E2E;border-radius:3px;padding:1px 2px;font-weight:700;text-decoration:underline wavy rgba(180,50,50,0.45);}

  .ak-heading{font-family:'Gowun Batang',serif;font-size:14.5px;font-weight:700;color:var(--ink-soft);margin:4px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px;margin-bottom:28px;}
  .err-card{background:#fff;border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s;border-top:4px solid var(--c,#999);}
  .err-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .err-card .card-front{padding:15px 17px 13px;}
  .err-card .err-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:9px;background:var(--tag-bg,#eee);color:var(--tag-color,#555);}
  .err-card .wrong-text{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:#8B2E2E;line-height:1.6;margin-bottom:5px;}
  .err-card .hint-line{font-size:12.5px;color:var(--ink-soft);}
  .err-card .open-indicator{font-size:11px;color:var(--accent-gold);font-weight:700;margin-top:8px;}
  .err-card.open .open-indicator{display:none;}
  .err-card .card-reveal{padding:0 17px;max-height:0;overflow:hidden;transition:max-height .33s ease,padding .33s ease;border-top:1px dashed transparent;}
  .err-card.open .card-reveal{max-height:280px;padding:13px 17px 15px;border-top-color:var(--line);}
  .reveal-row{margin-bottom:11px;}
  .reveal-row:last-child{margin-bottom:0;}
  .reveal-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .reveal-text{font-family:'Gowun Batang',serif;font-size:13.5px;line-height:1.65;}
  .reveal-text.reason{color:var(--navy);}
  .reveal-text.correct{color:var(--c-hon);font-weight:700;}

  /* PROGRESS */
  .progress-bar-wrap{position:sticky;bottom:16px;pointer-events:none;display:flex;justify-content:center;padding:0 16px;}
  .progress-pill{background:var(--navy);color:#fff;border-radius:30px;padding:9px 18px;font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;pointer-events:all;}
  .progress-track{width:100px;height:5px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent-gold);border-radius:3px;transition:width .3s;}
  .review-btn{background:none;border:1.5px solid rgba(255,255,255,0.3);color:#fff;font-family:'Gowun Dodum',sans-serif;font-size:12px;padding:4px 11px;border-radius:14px;cursor:pointer;}
  .review-btn:hover{background:rgba(255,255,255,0.1);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,15,8,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-card{background:var(--paper);border-radius:12px;padding:28px 26px;width:min(360px,100%);box-shadow:var(--shadow);}
  .modal-card h3{font-family:'Gowun Batang',serif;font-size:20px;margin-bottom:6px;}
  .modal-card p{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;line-height:1.7;}
  .modal-card input{width:100%;font-family:'Gowun Dodum',sans-serif;font-size:15px;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .modal-card input:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .modal-err{color:#8B2E2E;font-size:12.5px;min-height:18px;margin-top:6px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .btn{font-family:'Gowun Dodum',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;border:none;border-radius:8px;padding:12px 18px;background:var(--navy);color:#fff;transition:transform .12s,opacity .12s;flex:1;}
  .btn:hover{transform:translateY(-1px);}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line);}

  @media(max-width:560px){
    .mode-tab span{font-size:12.5px;}
    .progress-track{width:70px;}
    .ak-tab-btn span{font-size:12px;}
  }
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<div class="site-header">
  <div class="header-inner">
    <div>
      <p class="header-kicker">5학년 국어 · 문장 성분의 호응 관계</p>
      <h1 class="header-title">우당탕탕 5학년 1반 편지</h1>
      <p class="header-sub">수행평가 사전 학습 참고 자료</p>
    </div>
    <div class="header-right">
      <span class="mode-label" id="modeLabelEl">📖 학습 모드</span>
      <button class="answerkey-btn" id="answerKeyBtn" type="button">🔑 답안지 열기</button>
    </div>
  </div>
  <div class="mode-bar">
    <div class="mode-bar-inner" id="modeBar" role="tablist">
      <!-- study mode: type tabs; answer mode: letter tabs -->
    </div>
  </div>
</div>

<div class="main" id="mainArea">
  <!-- pages injected by JS -->
</div>

<!-- progress pill (answer mode only) -->
<div class="progress-bar-wrap" id="progressWrap" style="display:none;">
  <div class="progress-pill">
    <span id="progressText">0 / 10 확인함</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <button class="review-btn" id="reviewBtn" type="button" style="display:none;">접기 ▲</button>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="passModal" style="display:none;">
  <div class="modal-card">
    <h3>🔑 답안지 열기</h3>
    <p>선생님용 답안지입니다. 비밀번호를 입력해주세요.</p>
    <input type="password" id="passInput" placeholder="비밀번호 입력" autocomplete="off">
    <p class="modal-err" id="passErr"></p>
    <div class="modal-actions">
      <button class="btn secondary" id="passCancelBtn" type="button">취소</button>
      <button class="btn" id="passConfirmBtn" type="button">확인</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
const PASS = '51';

/* ── 학습 모드: 4가지 유형 개념 + 예시 ── */
const TYPES = [
  {
    id:'time', cls:'type-time', icon:'⏱', title:'① 시간을 나타내는 말과 서술어의 호응',
    desc:`<strong>시간을 나타내는 부사어</strong>(어제, 오늘, 내일, 지난주, 앞으로 등)는 문장의 <strong>서술어 시제</strong>와 반드시 맞아야 해요.<br>
      과거 표현(어제, 지난주)은 과거 서술어(-했어, -었다)와, 미래 표현(내일, 앞으로)은 미래 서술어(-할 거야, -겠다)와 짝을 이뤄야 해요.`,
    formula:['어제 / 지난주 / 예전에', '→', '~했어 / ~었다', '&nbsp;&nbsp;&nbsp;', '내일 / 앞으로 / 다음에', '→', '~할 거야 / ~겠다'],
    examples:[
      {wrong:'내가 <span style="color:#8B2E2E;font-weight:700;">내일</span> 그 소식을 듣고 <span style="color:#8B2E2E;font-weight:700;">화가 났다</span>',
       correct:'내가 오늘 그 소식을 듣고 화가 났어', hint:'내일(미래) + 화가 났다(과거) → 시제 불일치'},
      {wrong:'지난주에 너에게 <span style="color:#8B2E2E;font-weight:700;">고백할 거야</span>',
       correct:'오늘 너에게 고백할게', hint:'지난주(과거) + 고백할 거야(미래) → 시제 불일치'},
      {wrong:'우리 그냥 편한 친구로 <span style="color:#8B2E2E;font-weight:700;">과거에 잘 지내자</span>',
       correct:'앞으로 잘 지내자', hint:'앞으로의 다짐에 과거(과거에) 사용'},
    ]
  },
  {
    id:'neg', cls:'type-neg', icon:'✗', title:'② 부정의 뜻을 나타내는 부사어와 서술어의 호응',
    desc:`<strong>전혀, 결코, 여간</strong> 같은 부사어는 반드시 <strong>부정 서술어</strong>(-지 않다, -지 못하다, 없다)와 함께 써야 해요.<br>
      긍정 서술어와 쓰면 문장의 뜻이 반대로 바뀌거나 어색해져요.`,
    formula:['전혀 / 결코 / 여간', '→', '반드시 뒤에', '~않다 / ~없다 / ~못하다'],
    examples:[
      {wrong:'<span style="color:#8B2E2E;font-weight:700;">결코</span> 행복해',
       correct:'정말 / 진짜 행복해 (또는 "결코 행복하지 않아")', hint:'결코 + 긍정 서술어 → 부정 서술어 필요'},
      {wrong:'너를 좋아하는 친구를 본 적이 <span style="color:#8B2E2E;font-weight:700;">전혀 있기</span> 때문이야',
       correct:'전혀 없기 때문이야', hint:'전혀 + 있다(긍정) → 없다(부정)로 바꿔야'},
      {wrong:'운동도 <span style="color:#8B2E2E;font-weight:700;">여간 잘해</span>',
       correct:'운동도 여간 잘하는 게 아니야', hint:'여간 → 뒤에 "~이 아니다" 형태 필요'},
    ]
  },
  {
    id:'hon', cls:'type-hon', icon:'🙏', title:'③ 높임의 대상에 맞지 않는 높임 표현',
    desc:`높임 표현(-주셔서, -드릴게, -계십니다, -주십시오 등)은 <strong>높여야 할 대상</strong>(선생님, 부모님, 어른)에게만 사용해야 해요.<br>
      <strong>친구나 같은 또래</strong>에게 높임 표현을 쓰면 어색하거나 부자연스러워요.`,
    formula:['친구에게', '→', '-줘, -해, -할게', '&nbsp;&nbsp;&nbsp;', '어른·선생님에게', '→', '-주셔서, -드릴게, -해 주십시오'],
    examples:[
      {wrong:'네가 나를 친절하게 <span style="color:#8B2E2E;font-weight:700;">도와주셔서</span>',
       correct:'도와줘서', hint:'친구(민주) → 높임 불필요'},
      {wrong:'너를 꼭 <span style="color:#8B2E2E;font-weight:700;">초대해 드릴게</span>',
       correct:'초대할게', hint:'-드릴게 → 윗사람에게 쓰는 표현'},
      {wrong:'내일 교실에서 <span style="color:#8B2E2E;font-weight:700;">웃어주실 거지?</span>',
       correct:'웃어줄 거지?', hint:'친구에게 -주실 → 높임 불필요'},
    ]
  },
  {
    id:'wae', cls:'type-wae', icon:'↩', title:'④ 까닭을 나타내는 부사어(왜냐하면)와 서술어의 호응',
    desc:`<strong>왜냐하면</strong>으로 시작하는 문장은 반드시 <strong>'~기 때문이다 / ~기 때문이야'</strong>로 끝나야 해요.<br>
      '왜냐하면'은 이유를 설명하는 접속어이므로, 뒤에 이유를 나타내는 종결 표현이 반드시 따라와야 해요.`,
    formula:['왜냐하면 ~', '→', '반드시', '~기 때문이다 / ~기 때문이야'],
    examples:[
      {wrong:'<span style="color:#8B2E2E;font-weight:700;">왜냐하면</span> 넌 정말 친절하고 기분이 <span style="color:#8B2E2E;font-weight:700;">좋다</span>',

    letterText:`사랑하는 5학년 1반 친구들아, 나 반장 유리야. 요즘 우리 반에 철수랑 영수, 민주 때문에 <mark>사건이 전혀 터졌지</mark>? 어제 방과 후에 철수랑 영수가 운동장에서 심하게 싸우더라고. 두 사람이 민주 때문에 다투는 모습을 보니 <mark>내 마음이 여간 기쁘지 않았어</mark>. 우리가 같은 반이 된 지 <mark>벌써 6개월 전인데</mark>, 서로 싸우는 모습은 <mark>전혀 보기 좋기 때문이야</mark>. 그리고 철수랑 영수는 민주에게 자꾸 이상한 고백을 <mark>던지고 계십니다</mark>. 왜냐하면 민주는 너희 둘 다 아무 관심이 없기 때문이다. 친구들아, 서로 좋아하는 마음은 아름답지만 남을 괴롭히면서 고백하면 <mark>결코 멋있어</mark>. 앞으로는 다투지 말고 사이좋게 지내자. 내일부터는 우리 반 모두가 서로를 <mark>존중하고 아껴 주십시오</mark>. 모두 즐거운 학교생활을 만들자!\n\n우리 반의 평화를 바라는 반장 유리가`,
    total:7,
    cards:[
      {c:'var(--c-neg)',tb:'#FCEDEA',tc:'#7A2B1E',tag:'✗ 부정 호응',wrong:'사건이 전혀 터졌지?',hint:"'전혀'는 부정 표현과 함께 써야 해요.",reason:"'전혀'는 부정 서술어와 어울리는 부사예요. 사건이 '터졌다'는 긍정적 사실 서술이므로 맞지 않아요.",correct:'사건이 크게 / 크게 한 번 터졌지?'},
      {c:'var(--c-neg)',tb:'#FCEDEA',tc:'#7A2B1E',tag:'✗ 부정 호응',wrong:'내 마음이 여간 기쁘지 않았어',hint:'이 표현이 실제로 어떤 뜻인지 생각해보세요.',reason:"'여간 기쁘지 않다'는 '매우 기쁘다'는 뜻이에요. 문맥상(싸우는 것을 봐서 불편함) 뜻이 반대가 돼요.",correct:'내 마음이 여간 불편하지 않았어 / 전혀 기쁘지 않았어'},
      {c:'var(--c-time)',tb:'#FFF0E5',tc:'#9B4A18',tag:'⏱ 시간 호응',wrong:'같은 반이 된 지 벌써 6개월 전인데',hint:'기간을 나타내는 표현을 확인해보세요.',reason:"'된 지 6개월 전'은 어색한 표현이에요. '6개월이 지났다/째다'로 써야 자연스러워요.",correct:'같은 반이 된 지 벌써 6개월이 지났는데 / 6개월째인데'},
      {c:'var(--c-neg)',tb:'#FCEDEA',tc:'#7A2B1E',tag:'✗ 부정 호응',wrong:'서로 싸우는 모습은 전혀 보기 좋기 때문이야',hint:"'전혀'와 어울리는 서술어를 확인해봐요.",reason:"'전혀'는 '좋지 않다'처럼 부정 서술어와 어울려야 해요.",correct:'서로 싸우는 모습은 전혀 보기 좋지 않기 때문이야'},
      {c:'var(--c-hon)',tb:'#E8F2EC',tc:'#23472F',tag:'🙏 높임 표현',wrong:'이상한 고백을 던지고 계십니다',hint:'높임의 대상이 맞지 않아요.',reason:"편지를 쓰는 대상(철수, 영수)은 같은 반 친구이므로 '-계십니다'라는 높임 표현은 맞지 않아요.",correct:'이상한 고백을 하고 있어 / 던지고 있어'},
      {c:'var(--c-neg)',tb:'#FCEDEA',tc:'#7A2B1E',tag:'✗ 부정 호응',wrong:'고백하면 결코 멋있어',hint:"'결코'는 부정 표현과 함께 써야 해요.",reason:"'결코'는 부정 서술어와만 어울려요. 문맥상 '멋없다'는 뜻이니 서술어도 부정형으로 바꿔야 해요.",correct:'고백하면 결코 멋있지 않아'},
      {c:'var(--c-hon)',tb:'#E8F2EC',tc:'#23472F',tag:'🙏 높임 표현',wrong:'서로를 존중하고 아껴 주십시오',hint:'높임의 대상이 맞지 않아요.',reason:"같은 반 친구들에게 '-주십시오'라는 격식 높임 표현은 어색해요.",correct:'서로를 존중하고 아껴 주자'},
    ]
  }
];

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let mode = 'study'; // 'study' | 'answer'
let studyTab = 0;   // index into TYPES
let answerTab = 0;  // index into LETTERS

/* ══════════════════════════════════════════
   RENDER HELPERS
══════════════════════════════════════════ */
function el(id){ return document.getElementById(id); }

function renderModeBar(){
  const bar = el('modeBar');
  bar.innerHTML = '';
  if(mode === 'study'){
    TYPES.forEach((t,i)=>{
      const btn = document.createElement('button');
      btn.className = 'mode-tab' + (i===studyTab?' active':'');
      btn.innerHTML = `<span>${t.icon} ${t.id==='time'?'시간 호응':t.id==='neg'?'부정 호응':t.id==='hon'?'높임 표현':'왜냐하면'}</span>유형 ${i+1}`;
      btn.addEventListener('click',()=>{ studyTab=i; renderAll(); });
      bar.appendChild(btn);
    });
  } else {
    LETTERS.forEach((l,i)=>{
      const btn = document.createElement('button');
      btn.className = 'mode-tab' + (i===answerTab?' active':'');
      btn.innerHTML = `<span>${l.short}</span>${i+1}단계`;
      btn.addEventListener('click',()=>{ answerTab=i; renderAll(); updateProgress(); });
      bar.appendChild(btn);
    });
  }
}

function renderStudyPage(){
  const t = TYPES[studyTab];
  const formulaHtml = t.formula.map(f=>`<span class="${f==='→'?'arrow':f===t.formula.find(x=>['반드시','~않다 / ~없다 / ~못하다','~기 때문이다 / ~기 때문이야','~했어 / ~었다','~할 거야 / ~겠다'].includes(x))?'must':''}">${f}</span>`).join('');

  const exHtml = t.examples.map(e=>`
    <div class="ex-card" style="--c:${t.id==='time'?'var(--c-time)':t.id==='neg'?'var(--c-neg)':t.id==='hon'?'var(--c-hon)':'var(--c-wae)'};">
      <div class="ex-front">
        <p class="ex-label">어색한 표현</p>
        <p class="ex-text-wrong">${e.wrong}</p>
        <p class="ex-hint">${e.hint}</p>
        <hr class="ex-divider">
        <p class="ex-label">바르게 고친 표현</p>
        <p class="ex-text-correct">${e.correct}</p>
      </div>
    </div>`).join('');

  return `<div class="page visible" id="page-study">
    <div class="study-intro">
      <h2>문장 성분의 호응 관계란?</h2>
      <p>문장 안에서 어떤 성분(주어, 목적어, 부사어 등)과 서술어가 짝을 이뤄야 자연스러운 문장이 돼요. 이 짝이 맞지 않으면 문장이 어색해지거나 뜻이 반대가 되기도 해요. 수행평가에서는 편지 속에서 이런 어색한 표현을 찾아 이유와 바른 표현을 쓰게 됩니다.</p>
    </div>
    <div class="type-section ${t.cls}">
      <div class="type-header">
        <div class="type-icon">${t.icon}</div>
        <p class="type-title">${t.title}</p>
      </div>
      <p class="type-desc">${t.desc}</p>
      <div class="formula-box">${formulaHtml}</div>
      <div class="ex-grid">${exHtml}</div>
    </div>
  </div>`;
}

function renderAnswerPage(){
  const l = LETTERS[answerTab];
  const cardsHtml = l.cards.map(card=>`
    <div class="err-card" style="--c:${card.c}; --tag-bg:${card.tb}; --tag-color:${card.tc};">
      <div class="card-front">
        <span class="err-tag">${card.tag}</span>
        <p class="wrong-text">${card.wrong}</p>
        <p class="hint-line">${card.hint}</p>
        <p class="open-indicator">눌러서 확인 ▾</p>
      </div>
      <div class="card-reveal">
        <div class="reveal-row"><p class="reveal-label">어색한 이유</p><p class="reveal-text reason">${card.reason}</p></div>
        <div class="reveal-row"><p class="reveal-label">바르게 고친 표현</p><p class="reveal-text correct">${card.correct}</p></div>
      </div>
    </div>`).join('');

  return `<div class="page visible" id="page-answer">
    <button class="toggle-letter-btn" id="toggleLetter">📄 편지 전문 펼쳐보기 ▼</button>
    <div class="letter-card" id="letterCard" style="display:none; border-left-color:${l.letterAccent};">
      <p class="lk">${l.title}</p>
      <p class="lt">${l.letterText}</p>
    </div>
    <p class="ak-heading">총 ${l.total}개의 어색한 표현 — 눌러서 이유와 바른 표현 확인하기</p>
    <div class="cards-grid" id="cardsGrid">${cardsHtml}</div>
  </div>`;
}

function renderAll(){
  renderModeBar();
  const main = el('mainArea');
  if(mode==='study'){
    main.innerHTML = renderStudyPage();
    el('progressWrap').style.display = 'none';
    el('modeLabelEl').textContent = '📖 학습 모드';
    el('answerKeyBtn').textContent = '🔑 답안지 열기';
  } else {
    main.innerHTML = renderAnswerPage();
    el('progressWrap').style.display = 'flex';
    el('modeLabelEl').textContent = '🔑 답안지 모드';
    el('answerKeyBtn').textContent = '← 학습으로 돌아가기';
    attachAnswerEvents();
    updateProgress();
  }
}

function attachAnswerEvents(){
  const toggle = el('toggleLetter');
  if(toggle){
    toggle.addEventListener('click',()=>{
      const card = el('letterCard');
      const open = card.style.display!=='none';
      card.style.display = open?'none':'block';
      toggle.textContent = open?'📄 편지 전문 펼쳐보기 ▼':'📄 편지 전문 접기 ▲';
    });
  }
  document.querySelectorAll('.err-card').forEach(card=>{
    card.addEventListener('click',()=>{ card.classList.toggle('open'); updateProgress(); });
  });
}

function updateProgress(){
  if(mode!=='answer') return;
  const total = LETTERS[answerTab].total;
  const opened = document.querySelectorAll('.err-card.open').length;
  el('progressText').textContent = `${opened} / ${total} 확인함`;
  el('progressFill').style.width = total?`${(opened/total)*100}%`:'0%';
  el('reviewBtn').style.display = opened>0?'inline-block':'none';
}

el('reviewBtn').addEventListener('click',()=>{
  document.querySelectorAll('.err-card.open').forEach(c=>c.classList.remove('open'));
  updateProgress();
});

/* ══════════════════════════════════════════
   ANSWER KEY PASSWORD
══════════════════════════════════════════ */
el('answerKeyBtn').addEventListener('click',()=>{
  if(mode==='answer'){ mode='study'; renderAll(); return; }
  el('passInput').value='';
  el('passErr').textContent='';
  el('passModal').style.display='flex';
  setTimeout(()=>el('passInput').focus(),60);
});
el('passCancelBtn').addEventListener('click',()=>{ el('passModal').style.display='none'; });
el('passConfirmBtn').addEventListener('click',()=>{
  if(el('passInput').value!==PASS){ el('passErr').textContent='비밀번호가 올바르지 않아요.'; return; }
  el('passModal').style.display='none';
  mode='answer';
  renderAll();
});
el('passInput').addEventListener('keydown',e=>{ if(e.key==='Enter') el('passConfirmBtn').click(); });

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
renderAll();
</script>
</body>
</html>
